[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "thermoplume"
version = "0.1.0"
description = "Thermodynamic models for volcanic plume neutral buoyancy and external water interaction"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "numpy",
    "scipy",
]


[tool.setuptools.packages.find]
where = ["src"]